name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            local_app/requirements.txt
            local_app/deploy/nas/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r local_app/requirements.txt
      - name: Fetch verified application font
        run: python scripts/fetch-font.py
      - name: Public-content scan
        run: python scripts/check-public.py
      - name: Python tests
        working-directory: local_app
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Control-page tests
        working-directory: local_app
        run: node --test test_control.cjs
      - name: Rust bridge tests
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo test --locked --manifest-path local_app/bridge/Cargo.toml
